##
# @brief Docker Compose for robot development.
#
# Usage (Linux host with NVIDIA GPU):
#   docker compose --profile linux run --rm dev          # interactive shell
#   docker compose --profile linux --profile test run --rm test  # run tests
#
# Dev Container (Mac or Linux, no GPU required):
#   VS Code → "Reopen in Container"  (uses devcontainer service)
#
# From the interactive shell, run whatever you need:
#   ros2 launch robot_bringup robot.launch.py
#   ros2 launch robot_bringup gazebo.launch.py
#   ros2 launch turtlebot4_gz_bringup ...
#
# Prerequisites (Ubuntu host):
#   - NVIDIA GPU with drivers + nvidia-container-toolkit
#   - Run: xhost +local:docker
##

x-gpu-config: &gpu-config
  environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - GZ_SIM_RESOURCE_PATH=/ros2_ws/install/robot_description/share:/ros2_ws/install/robot_world/share/robot_world:/ros2_ws/install/robot_world/share/robot_world/models
    - GZ_SIM_SYSTEM_PLUGIN_PATH=/opt/ros/jazzy/lib:/pgm_map_creator_ws/install/lib/pgm_map_creator
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
    - .:/ros2_ws:cached
  network_mode: host
  ipc: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  stdin_open: true
  tty: true

services:
  dev:
    build:
      context: .
      target: dev-base
    volumes:
      - .:/ros2_ws:cached
    command: sleep infinity

  sim:
    build:
      context: .
      target: dev-base
    <<: *gpu-config
    command: sleep infinity

  chase-it:
    build:
      context: .
      target: cli
    profiles: ["chase-it"]
    <<: *gpu-config
    command: >
      /bin/bash -c
      "ros2 launch robot_bringup gazebo.launch.py"

  test:
    build:
      context: .
      target: cli
    profiles: ["test"]
    command: >
      /bin/bash -c
      "colcon test --packages-up-to robot_bringup robot_control &&
       colcon test-result --verbose"
    working_dir: /ros2_ws
