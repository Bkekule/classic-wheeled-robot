##
# @brief Docker Compose for robot launch (mock hardware) and testing.
#
# Usage:
#   docker compose up --build              # launch robot with mock hardware + RViz
#   docker compose run --rm test           # run colcon tests
##

services:
  robot:
    build: .
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

  test:
    build: .
    profiles: ["test"]
    command: >
      /bin/bash -c
      ". /opt/ros/jazzy/setup.sh &&
       . /ros2_control_ws/install/setup.sh &&
       . install/setup.sh &&
       colcon test &&
       colcon test-result --verbose"
    working_dir: /ros2_ws
