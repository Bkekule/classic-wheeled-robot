##
# @brief Docker Compose for robot development.
#
# Usage:
#   docker compose run --rm dev               # interactive shell
#   docker compose --profile test run --rm test   # run tests
#
# From the interactive shell, run whatever you need:
#   ros2 launch robot_bringup robot.launch.py
#   ros2 launch robot_bringup gazebo.launch.py
#   ros2 launch turtlebot4_gz_bringup ...
#
# Prerequisites (Ubuntu host):
#   - NVIDIA GPU with drivers + nvidia-container-toolkit
#   - Run: xhost +local:docker
##

x-gpu-config: &gpu-config
  environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - GZ_SIM_RESOURCE_PATH=/ros2_ws/install/robot_description/share:/ros2_ws/install/robot_world/share/robot_world:/ros2_ws/install/robot_world/share/robot_world/models:/ros2_ws/install/robot_world/share/robot_world
    - GZ_SIM_SYSTEM_PLUGIN_PATH=/opt/ros/jazzy/lib:/pgm_map_creator_ws/install/lib/pgm_map_creator
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
  network_mode: host
  ipc: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  stdin_open: true
  tty: true

services:
  dev:
    build: .
    <<: *gpu-config
    command: bash

  test:
    build: .
    profiles: ["test"]
    command: >
      /bin/bash -c
      ". /opt/ros/jazzy/setup.sh &&
       . /ros2_control_ws/install/setup.sh &&
       . install/setup.sh &&
       colcon test --packages-up-to robot_bringup robot_control &&
       colcon test-result --verbose"
    working_dir: /ros2_ws
